name: Forex Signal Scan

# Runs automatically every 15 minutes, all day, every day.
# You can also trigger it manually from the "Actions" tab on GitHub
# using the "Run workflow" button (workflow_dispatch below).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# This gives the workflow permission to push changes (like the
# updated state.json) back to the repo. Without this, GitHub only
# allows read access by default and the final step fails.
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the scan
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_once.py

      - name: Save any updated signal history back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update signal state [skip ci]"
          git push
